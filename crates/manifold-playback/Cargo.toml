[package]
name = "manifold-playback"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
manifold-core = { path = "../manifold-core" }
manifold-foundation = { path = "../manifold-foundation" }
manifold-editing = { path = "../manifold-editing" }
manifold-audio = { path = "../manifold-audio" }
log = "0.4"
kira = { workspace = true }
symphonia = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
midir = "0.11"
rosc = "0.10"
rusty_link = "0.4"
parking_lot = { workspace = true }
ahash = { workspace = true }

[build-dependencies]
cc = "1"

[dev-dependencies]
manifold-io = { path = "../manifold-io" }
# Synthetic preset fixtures for the modulation characterization tests register
# via inventory (manifold-nodes, which submits the shipping presets, isn't
# linked into this test binary).
inventory = "0.3"

[features]
# Test seams that inject inbound OSC and Ableton values headlessly; also turns
# on the change audit in every test build
# that links the testkit.
testkit = ["manifold-editing/change-audit"]
# The UI snapshot harness lends its own project to an engine for one tick.
project-lend = []

[lints]
workspace = true
