[package]
name = "manifold-nodes-scene"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
ahash = { workspace = true }
arrayvec = "0.7"
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
gltf = { version = "1", features = ["KHR_materials_emissive_strength", "KHR_materials_transmission", "extensions", "KHR_lights_punctual", "KHR_texture_transform", "KHR_materials_specular", "KHR_materials_ior", "KHR_materials_pbrSpecularGlossiness", "KHR_materials_volume", "KHR_materials_unlit", "allow_empty_texture"] }
half = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "exr"] }
inventory = "0.3"
log = { workspace = true }
manifold-core = { path = "../manifold-core" }
manifold-foundation = { path = "../manifold-foundation" }
manifold-gpu = { path = "../manifold-gpu" }
manifold-node-engine = { path = "../manifold-node-engine" }
naga = { version = "28", features = ["wgsl-in", "msl-out"] }
png = "0.18"
serde = { workspace = true }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[dev-dependencies]
glam = "0.29.3"
manifold-node-engine = { path = "../manifold-node-engine", features = ["testkit"] }

[build-dependencies]
sha2 = "0.10"

[[test]]
name = "main"
path = "tests/main.rs"

[[test]]
name = "gpu_proofs"
path = "tests/gpu_proofs/main.rs"
required-features = ["gpu-proofs"]

[features]
testkit = ["manifold-node-engine/testkit"]
gpu-proofs = ["manifold-node-engine/gpu-proofs", "manifold-node-engine/testkit"]
rt-perf-proofs = ["gpu-proofs"]

[lints]
workspace = true
