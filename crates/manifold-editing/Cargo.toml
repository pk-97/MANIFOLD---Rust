[package]
name = "manifold-editing"
version = "0.1.0"
edition = "2024"
publish = false

[features]
gpu-proofs = []
# Fingerprint every part around each edit and panic on an undeclared change (D10).
change-audit = ["manifold-core/change-audit"]

[dependencies]
manifold-core = { path = "../manifold-core" }

[dev-dependencies]
manifold-io = { path = "../manifold-io" }
manifold-core = { path = "../manifold-core", features = ["change-audit"] }
inventory = "0.3"
serde_json = { workspace = true }

[lints]
workspace = true
