# RT T3-8 multi-bounce GI (RAYTRACING_DESIGN.md section 11) — the
# WORKFLOW_RUNTIME_DESIGN section 5 P3 shakedown program. Task BUG-17r3.
# Run from the main checkout: target/debug/workflow run crates/workflow-runtime/programs/rt-t38-multibounce.toml
#
# Gate mechanics (section 11.4): I-MB1 is a cross-commit byte diff of
# RtCompare.json; the bounce 1-vs-2 discrimination is a cross-commit A/B —
# MB-A's gate captures the bleed/ambient fixtures at 1 bounce, MB-B's gate
# re-captures at 2 and scripts/rt_region_probe.py (the transform step) rules.
name = "rt-t38-multibounce"
task = "BUG-17r3"
token_budget = 400000
request_timeout_s = 1800

[target]
label = "rt-t38-multibounce"
branch = "lane/rt-t38-multibounce"

# Pre-change RtCompare capture for I-MB1 (runs in the worktree at the base
# tip, before any execute commit). --linear on the probe fixtures so region
# means are not tonemap-compressed; RtCompare stays default (byte diff).
[[step]]
name = "capture-baseline-render"
title = "Capture the pre-change RtCompare baseline render"
opcode = "gate"
gate_timeout_s = 2400
gate = [
  "cargo run -q -p manifold-renderer --bin graph-tool -- render tools/rt_prototype/compare/RtCompare.json --kind generator --out \"$WORKFLOW_RUN_DIR/rtcompare-pre.png\"",
]

[[step]]
name = "refactor-bounce-loop"
title = "Bounce-loop refactor, behavior-identical (byte-identical RtCompare)"
opcode = "execute"
model = "deepseek-v4-pro"
max_tokens = 24000
retry_cap = 2
template = "rt-t38-refactor-bounce-loop-brief.md"
inputs = ["file:crates/manifold-gpu/src/metal/raytrace.rs"]
gate_timeout_s = 2400
gate = [
  "cargo clippy -p manifold-gpu -p manifold-renderer -- -D warnings",
  "sh -c 'test \"$(rg -o \"\\* SUN_BOUNCE_INTENSITY_SCALE\" crates/manifold-gpu/src/metal/raytrace.rs | wc -l | tr -d \" \")\" -eq 1'",
  "rg -q 'sun_bounce_at_hit' crates/manifold-gpu/src/metal/raytrace.rs",
  "cargo test -p manifold-renderer --features gpu-proofs --test gpu_proofs rt_ --no-fail-fast",
  "cargo run -q -p manifold-renderer --bin graph-tool -- render tools/rt_prototype/compare/RtCompare.json --kind generator --out \"$WORKFLOW_RUN_DIR/rtcompare-post.png\"",
  "cmp \"$WORKFLOW_RUN_DIR/rtcompare-pre.png\" \"$WORKFLOW_RUN_DIR/rtcompare-post.png\"",
  "cargo run -q -p manifold-renderer --bin graph-tool -- render tools/rt_prototype/compare/RtBleed.json --kind generator --linear --out \"$WORKFLOW_RUN_DIR/bleed-1.png\"",
  "cargo run -q -p manifold-renderer --bin graph-tool -- render tools/rt_prototype/compare/RtAmbientOnly.json --kind generator --linear --out \"$WORKFLOW_RUN_DIR/ambient-1.png\"",
]

[[step]]
name = "add-second-bounce"
title = "Enable the second GI bounce and capture the bleed/ambient fixtures"
opcode = "execute"
model = "deepseek-v4-pro"
max_tokens = 16000
retry_cap = 2
template = "rt-t38-add-second-bounce-brief.md"
inputs = ["file:crates/manifold-gpu/src/metal/raytrace.rs"]
gate_timeout_s = 2400
gate = [
  "cargo clippy -p manifold-gpu -p manifold-renderer -- -D warnings",
  "cargo test -p manifold-renderer --features gpu-proofs --test gpu_proofs rt_ --no-fail-fast",
  "cargo run -q -p manifold-renderer --bin graph-tool -- render tools/rt_prototype/compare/RtBleed.json --kind generator --linear --out \"$WORKFLOW_RUN_DIR/bleed-2.png\"",
  "cargo run -q -p manifold-renderer --bin graph-tool -- render tools/rt_prototype/compare/RtAmbientOnly.json --kind generator --linear --out \"$WORKFLOW_RUN_DIR/ambient-2.png\"",
  "cmp \"$WORKFLOW_RUN_DIR/ambient-1.png\" \"$WORKFLOW_RUN_DIR/ambient-2.png\"",
]

# The bleed/control ruling (transform, deterministic, parks on red). Its JSON
# artifact carries pin_threshold for the in-repo regression test.
[[step]]
name = "rule-on-bleed-probe"
title = "Rule on the bleed-vs-control delta between 1 and 2 bounces"
opcode = "transform"
artifact = "json"
template = "rt-t38-probe-note.md"
command = "scripts/rt_region_probe.py --a \"$WORKFLOW_RUN_DIR/bleed-1.png\" --b \"$WORKFLOW_RUN_DIR/bleed-2.png\" --rect 80,175,230,235 --min-delta 0.008 --max-control 0.01"

[[step]]
name = "pin-regression-test"
title = "Pin the multi-bounce result with an in-repo regression test"
opcode = "execute"
model = "deepseek-v4-pro"
max_tokens = 24000
retry_cap = 2
template = "rt-t38-pin-regression-test-brief.md"
inputs = ["rule-on-bleed-probe", "file:crates/manifold-renderer/tests/gpu_proofs/rt_p3_emissive_gi.rs", "file:crates/manifold-renderer/tests/gpu_proofs/main.rs"]
gate_timeout_s = 2400
gate = [
  "cargo clippy -p manifold-renderer -- -D warnings",
  "cargo test -p manifold-renderer --features gpu-proofs --test gpu_proofs rt_t38 --no-fail-fast",
]

# Model review verdict, recorded to the shared decisions trail via the task
# id (D8). The lead's own review still gates the landing — this seat rules
# only on conformance to the written invariants.
[[step]]
name = "conformance-review"
title = "Model conformance review of the whole multi-bounce slice"
opcode = "generate"
model = "deepseek-v4-pro"
max_tokens = 8000
retry_cap = 2
artifact = "verdict"
template = "rt-t38-review-brief.md"
inputs = ["refactor-bounce-loop", "add-second-bounce", "pin-regression-test", "rule-on-bleed-probe"]
