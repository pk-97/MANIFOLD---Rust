# P2 acceptance (WORKFLOW_RUNTIME_DESIGN.md section 5, Phasing): replay R2 Step 1
# (specular history plumbing) from its historical base d017c971 — the runtime
# drives a live model to a gate-green commit on a throwaway branch.
# Run from the main checkout:  target/debug/workflow run crates/workflow-runtime/programs/replay-r2-step1.toml
name = "replay-r2-step1"

[target]
label = "wr-p2-replay"
branch = "lane/wr-p2-replay"
tip = "d017c971"

[[step]]
name = "plumbing"
opcode = "execute"
# glm-4.7: Flash parked this replay at cap-3 (D-54 reasoning wall, truncated
# JSON x3); kimi seat 500'd at the proxy on the second run (2026-07-29).
model = "glm-4.7"
max_tokens = 24000
retry_cap = 2
template = "replay-r2-step1-brief.md"
gate = ["cargo clippy -p manifold-gpu -p manifold-renderer -- -D warnings"]
