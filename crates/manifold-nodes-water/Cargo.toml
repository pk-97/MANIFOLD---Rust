[package]
name = "manifold-nodes-water"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
manifold-node-engine = { path = "../manifold-node-engine" }
manifold-core = { path = "../manifold-core" }
manifold-foundation = { path = "../manifold-foundation" }
manifold-gpu = { path = "../manifold-gpu" }
manifold-physics = { path = "../manifold-physics" }
manifold-water-rigid = { path = "../manifold-water-rigid" }
manifold-water-liquid = { path = "../manifold-water-liquid" }
manifold-water-gpu-flip = { path = "../manifold-water-gpu-flip" }
manifold-water-gpu-mpm = { path = "../manifold-water-gpu-mpm" }
manifold-water-whitewater = { path = "../manifold-water-whitewater" }
manifold-fluids = { path = "../manifold-fluids" }
ahash = { workspace = true }
arrayvec = "0.7"
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
half = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "exr"] }
inventory = "0.3"
log = { workspace = true }
naga = { version = "28", features = ["wgsl-in", "msl-out"] }
serde = { workspace = true }
serde_json = { version = "1", features = ["float_roundtrip"] }

[dependencies.glam]
version = "0.29.3"
optional = true

[dev-dependencies]
glam = "0.29.3"
manifold-node-engine = { path = "../manifold-node-engine", features = ["testkit"] }
manifold-playback = { path = "../manifold-playback" }
manifold-water-rigid = { path = "../manifold-water-rigid", features = ["testkit"] }
manifold-water-liquid = { path = "../manifold-water-liquid", features = ["testkit"] }
manifold-water-gpu-flip = { path = "../manifold-water-gpu-flip", features = ["testkit"] }
manifold-water-gpu-mpm = { path = "../manifold-water-gpu-mpm", features = ["testkit"] }
manifold-water-whitewater = { path = "../manifold-water-whitewater", features = ["testkit"] }
sha2 = "0.10"
zstd = "0.13.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"

[features]
testkit = ["manifold-node-engine/testkit", "manifold-water-rigid/testkit", "manifold-water-liquid/testkit", "manifold-water-gpu-flip/testkit", "manifold-water-gpu-mpm/testkit", "manifold-water-whitewater/testkit", "dep:glam", "dep:objc2"]
gpu-proofs = ["testkit", "manifold-node-engine/gpu-proofs", "manifold-gpu/gpu-proofs", "manifold-water-rigid/gpu-proofs", "manifold-water-liquid/gpu-proofs", "manifold-water-gpu-flip/gpu-proofs", "manifold-water-gpu-mpm/gpu-proofs", "manifold-water-whitewater/gpu-proofs"]
fluid-perf-proofs = ["gpu-proofs"]
whitewater-oracle = ["gpu-proofs", "manifold-fluids/whitewater-oracle"]

[lints]
workspace = true
