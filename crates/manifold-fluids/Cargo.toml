[package]
name = "manifold-fluids"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[features]
# FLIP's own whitewater fields as a test oracle (GPU_WHITEWATER_DESIGN.md O1, O2).
whitewater-oracle = []
# The native projected faces as a probe oracle (GPU FLIP still-pool bounds).
face-oracle = []

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
serde = { workspace = true }
manifold-foundation = { path = "../manifold-foundation" }
manifold-physics = { path = "../manifold-physics" }

[build-dependencies]
cc = "1"
sha2 = "0.10"

[lints]
workspace = true
