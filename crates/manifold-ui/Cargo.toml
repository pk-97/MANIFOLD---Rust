[package]
name = "manifold-ui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ahash = { workspace = true }
bitflags = "2"
manifold-editing = { path = "../manifold-editing" }
# PRESET_BROWSER_AUDITION D2 (§3.3): ParamsAction::AddEffectClicked carries
# the editing crate's EffectTarget directly (a UI-side twin was rejected) —
# the one place the UI names an editing type.
manifold-foundation = { path = "../manifold-foundation" }
# UI_AUTOMATION_DESIGN.md section 4: AutomationAction and friends round-trip through
