apiVersion: 1

# manifold-fleet.json references the Prometheus datasource by the uid "Prometheus".
# Provisioning without an explicit uid makes Grafana auto-generate one, leaving that
# dashboard pointed at a datasource that does not exist — every panel renders
# "No data" with no error anywhere. Grafana cannot rewrite an existing datasource's
# uid in place (it fails startup with "data source not found"), so the uid change has
# to be a delete followed by a create.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    uid: Prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
