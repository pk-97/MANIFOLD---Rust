# macOS links with Apple's own linker (ld-prime). It links the debug app in
# about half the time Homebrew lld takes, so no linker override is set.

# No compile cache (sccache): it stops release crates from overlapping, which
# cost more than its cache hits saved.

# `cargo xtask ui-snap <scene> [--dump]` → the headless UI snapshot harness
# (feature-gated subcommand of manifold-app).
# `cargo xtask perf-soak <project> --seconds N [--start <beats>]
# [--update-baseline]` → the headless frame-budget soak gate.
# Both subcommands dispatch off argv[1]
# in the same `manifold` binary — one dispatcher, two feature-gated modules.
[alias]
xtask = "run --quiet -p manifold-app --features ui-snapshot,perf-soak --"
