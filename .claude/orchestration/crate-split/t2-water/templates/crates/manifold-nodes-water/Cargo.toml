[package]
name = "manifold-nodes-water"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
manifold-node-engine = { path = "../manifold-node-engine" }
manifold-core = { path = "../manifold-core" }
manifold-foundation = { path = "../manifold-foundation" }
manifold-gpu = { path = "../manifold-gpu" }
manifold-physics = { path = "../manifold-physics" }
manifold-fluids = { path = "../manifold-fluids" }
ahash = { workspace = true }
arrayvec = "0.7"
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
half = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "exr"] }
inventory = "0.3"
log = { workspace = true }
naga = { version = "28", features = ["wgsl-in", "msl-out"] }
serde = { workspace = true }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
zstd = "0.13.3"

[build-dependencies]
sha2 = "0.10"

[dependencies.glam]
version = "0.29.3"
optional = true

[dev-dependencies]
glam = "0.29.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"

[features]
testkit = ["manifold-node-engine/testkit", "dep:glam", "dep:objc2"]
gpu-proofs = ["testkit", "manifold-node-engine/gpu-proofs", "manifold-gpu/gpu-proofs"]
fluid-perf-proofs = ["gpu-proofs"]
matter-perf-proofs = ["gpu-proofs"]
water-race-probes = ["gpu-proofs", "fluid-perf-proofs", "manifold-fluids/face-oracle"]
whitewater-oracle = ["gpu-proofs", "manifold-fluids/whitewater-oracle"]

[lints]
workspace = true
